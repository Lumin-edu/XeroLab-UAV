fsm:
  click_goal_en: true                    # 是否启用目标点订阅。
  click_goal_topic: "/goal_pose"        # 目标点输入话题；由 action_controller 转发到这里。
  click_height: -10.0                    # 目标高度（m）；大于 -5 时覆盖目标 z，当前值表示保留目标 z。
  click_yaw_en: true                     # 是否从目标姿态四元数读取目标 yaw。
  replan_rate: 15.0                      # 重规划频率（Hz）。
  cmd_topic: "/planning/pos_cmd"        # SUPER 位置/运动状态命令话题。
  mpc_cmd_topic: "/planning_cmd/poly_traj"  # 七阶多项式轨迹话题，action 从这里读取轨迹。
  timer_en: true                         # 是否启用 SUPER 执行、重规划和命令发布定时器。

super_planner:
  backup_traj_en: true                   # 是否在正常轨迹失败时生成/使用备份轨迹。
  detailed_log_en: false                 # 详细日志开关；当前源码读取了此项，但未发现实际使用处。
  visualization_en: true                 # 是否发布 SUPER 规划可视化。
  use_fov_cut: false                     # 是否按传感器视场裁剪局部规划区域。
  print_log: false                       # 是否输出 SUPER 运行日志。
  visual_process: false                  # 过程可视化开关；当前源码读取了此项，但未发现实际使用处。
  frontend_in_known_free: false           # 前端是否把未知区域视作障碍；false 时未知格可按自由空间搜索。
  goal_yaw_en: true                      # 是否在轨迹末端使用目标 yaw。
  goal_vel_en: false                     # 远距离目标是否设置非零终端速度；目标超过规划视野一半时生效。
  corridor_bound_dis: 1.0                # 生成安全走廊时扩展搜索边界的距离（m）。
  corridor_line_max_length: 1.2          # 走廊生成用路径种子线段的最大长度（m）。
  safe_corridor_line_max_length: 5.0     # 安全走廊最大延伸长度（m）。
  iris_iter_num: 2                       # CIRI/IRIS 安全走廊优化迭代次数。
  obs_skip_num: 2                        # 障碍点搜索的跳点设置；数值越大处理点越少。
  replan_forward_dt: 0.1                 # 单次重规划允许向前推进的时间（s）；超时会判定失败。
  planning_horizon: 7.0                  # 局部规划前视距离（m）。
  sensing_horizon: -1                    # 感知前视距离（m）；小于等于 0 时不启用该距离裁剪。
  receding_dis: 4.0                      # 滚动重规划距离（m）。
  robot_r: 0.2                           # 碰撞检测中使用的无人机等效半径（m）。
  backup_stop_time_scale: 1.5            # 备份制动轨迹的时间余量系数；1.5 表示按理论制动时间增加 50% 初始余量。
  yaw_dot_max: 3.0                        # yaw 最大角速度设置（rad/s）。
  yaw_mode: 1                            # yaw 模式：1 朝向速度方向，2 朝向目标；当前版本读取但未见实际使用处。
  mpc_horizon: 15                        # MPC 预测步数；当前多项式轨迹控制链路中读取但未见实际使用处。

traj_opt:
  switch:
    save_log_en: true                    # 是否保存优化器调试/失败日志文件。
    print_optimizer_log: true             # 是否在终端打印优化器代价和迭代信息。

  boundary:
    max_vel: 1.0                          # 轨迹速度模长上限（m/s）；优化器使用软惩罚，action 还会统一放慢轨迹以硬限速。
    max_acc: 1.5                          # 轨迹加速度模长上限（m/s^2，优化代价中的软约束）。
    max_jerk: 8.0                         # 轨迹 jerk 模长上限（m/s^3，优化代价中的软约束）。
    max_omg: 2.5                          # 机体角速度模长上限（rad/s，优化代价中的软约束）。
    max_acc_thr: 20.0                     # 推力上界对应的加速度值（m/s^2，优化时乘质量换算为力）。
    min_acc_thr: 6.0                      # 推力下界对应的加速度值（m/s^2，优化时乘质量换算为力）。
    penna_margin: 0.05                    # 备份轨迹边界检查的相对容差比例。

  exp_traj:
    pos_constraint_type: 1                # 位置变量类型：1 为 waypoint，2 为 corridor。
    energy_cost_type: 4                   # 遗留配置项；当前 SUPER 配置读取器不读取此键。
    block_energy_cost: false              # 是否关闭 MINCO 能量项；false 表示保留能量平滑代价。
    opt_accuracy: 5.0e-6                  # L-BFGS 优化收敛精度，无物理单位。
    scale_factor: 1.0                     # 遗留配置项；当前 SUPER 配置读取器不读取此键。
    integral_reso: 15                     # 每段轨迹代价积分的采样区间数。
    smooth_eps: 0.01                      # 平滑 L1 约束惩罚的平滑参数。
    penna_t: 12000.0                      # 轨迹总时间代价权重。
    penna_pos: 5.0e+6                    # 位置走廊违规惩罚权重。
    penna_vel: 5.0e+5                    # 速度超限惩罚权重；正值启用软惩罚。
    penna_acc: 5.0e+5                    # 加速度超限惩罚权重。
    penna_jerk: -5.0e+5                 # jerk 超限惩罚权重；负值不启用正权重惩罚。
    penna_attract: 1.0e+3                 # 轨迹靠近前端引导点的惩罚权重。
    penna_omg: 5.0e+5                    # 机体角速度超限惩罚权重。
    penna_thr: 1.0e+5                    # 推力超限惩罚权重。

  backup_traj:
    uniform_time_en: true                 # 备份轨迹各段是否使用相同持续时间。
    pos_constraint_type: 1                # 位置变量类型：1 为 waypoint，2 为 corridor。
    piece_num: 2                          # 备份轨迹的多项式段数。
    energy_cost_type: 4                   # 遗留配置项；当前 SUPER 配置读取器不读取此键。
    block_energy_cost: true               # 是否关闭 MINCO 能量项；true 表示仅优化时间和约束代价。
    opt_accuracy: 1.0e-6                  # L-BFGS 优化收敛精度，无物理单位。
    scale_factor: 1.0                     # 遗留配置项；当前 SUPER 配置读取器不读取此键。
    integral_reso: 12                     # 每段轨迹代价积分的采样区间数。
    smooth_eps: 0.01                      # 平滑 L1 约束惩罚的平滑参数。
    penna_t: 1200.0                       # 备份轨迹总时间代价权重。
    penna_ts: 1.0e+5                      # 备份轨迹起始时间优化权重。
    penna_pos: 1.0e+6                    # 位置走廊违规惩罚权重。
    penna_vel: 1.0e+5                    # 速度超限惩罚权重；正值启用软惩罚和备份超限检查。
    penna_acc: 1.0e+5                    # 加速度超限惩罚权重。
    penna_jerk: -1.0e+5                 # jerk 超限惩罚权重；负值不启用正权重惩罚。
    penna_omg: 1.0e+5                    # 机体角速度超限惩罚权重。
    penna_thr: 1.0e+5                    # 推力上下限超限惩罚权重；正值同时启用备份轨迹推力约束计算。

  flatness:
    mass: 1.64                            # 无人机质量（kg），用于平坦性/推力模型。
    dh: 0.35                              # 水平阻力模型系数；源码未标注单位。
    dv: 0.35                              # 垂直阻力模型系数；源码未标注单位。
    cp: 0.001                             # 寄生阻力模型系数；源码未标注单位。
    v_eps: 0.0001                         # 速度模长计算的平滑正则项；源码未标注单位。
    grav: 9.81                            # 重力加速度（m/s^2）。

astar:
  map_voxel_num: [ 500, 500, 100 ]        # A* 搜索网格 xyz 方向体素数量；代码会调整为奇数。
  visual_process: false                  # 是否可视化 A* 搜索过程。
  allow_diag: true                       # 是否允许 A* 沿对角方向扩展。
  heu_type: 2                            # A* 启发函数：0 对角距离，1 曼哈顿距离，2 欧氏距离。
  debug_visualization_en: false           # 是否启用 A* 调试可视化。

rog_map:
  resolution: 0.1                        # 概率占据地图体素分辨率（m）。
  inflation_resolution: 0.2               # 障碍物膨胀地图分辨率（m），须不小于 resolution。
  inflation_step: 2                      # 障碍物膨胀的格数；每格大小为 inflation_resolution。
  unk_inflation_en: false                # 是否把未知区域也作为膨胀障碍处理。
  unk_inflation_step: 1                  # 未知区域膨胀格数。
  map_size: [ 50, 50, 6 ]                # 地图 xyz 方向物理尺寸（m）。
  fix_map_origin: [ 0, 0, 1.5 ]           # 固定地图原点 xyz（m）；启用地图滑动时不作为固定原点使用。
  frontier_extraction_en: false           # 是否提取未知与已知区域交界的前沿。

  virtual_ceil_height: 3.5               # 虚拟天花板高度（m），会按地图分辨率离散化。
  virtual_ground_height: -0.7            # 虚拟地面栅格参数（m）；当前栅格设置下离散地面约为 -0.3 m，走廊底界约为 -0.1 m。

  load_pcd_en: false                     # 是否加载静态 PCD 地图；开启后可另设 pcd_name。

  map_sliding:
    enable: true                         # 是否启用随无人机位置移动的局部地图。
    threshold: 0.3                       # 地图中心开始滑动的距离阈值（m）。

  esdf:
    enable: false                        # 是否启用 ESDF 距离场地图。
    resolution: 0.1                     # ESDF 体素分辨率（m）。
    local_update_box: [ 5, 5, 3 ]        # ESDF 局部更新区域 xyz 尺寸（m）。

  ros_callback:
    enable: true                         # 是否订阅 ROS 点云/里程计并自动更新地图。
    cloud_topic: "/cloud_registered"    # 输入注册点云话题；FAST-LIO 输出。
    odom_topic: "/Odometry"             # 输入里程计话题；FAST-LIO 输出。
    odom_timeout: 2.0                    # 里程计允许的最大间隔（s），超过后视作超时。

  visualization:
    enable: true                         # 是否发布地图可视化数据。
    use_dynamic_reconfigure: false        # 动态参数重配置开关；当前 ROS 2 代码读取但未发现实际使用处。
    time_rate: 2                         # 可视化定时发布频率（Hz）；0 表示不按定时器触发。
    frame_rate: 0                        # 可视化帧触发频率设置；当前 ROS 2 代码读取但未发现实际使用处。
    range: [ 15, 15, 4 ]                 # 可视化地图 xyz 方向范围（m）。
    frame_id: "world"                   # 可视化参考坐标系；当前 ROS 2 发布代码使用固定 world。
    pub_unknown_map_en: false             # 是否发布未知区域点云。

  intensity_thresh: -10                  # 点云强度过滤阈值；仅大于 0 时启用，负值表示关闭。
  point_filt_num: 1                      # 点云抽样间隔；k 表示约每 k 个点保留一个，必须至少为 1。

  raycasting:
    enable: false                        # 是否用射线更新空闲区域；关闭时未占据格按未知处理。
    batch_update_size: 1                 # 累积多少次输入后批量更新概率地图；必须至少为 1。
    local_update_box: [ 100, 100, 5 ]    # 射线更新的局部 xyz 尺寸（m）。
    ray_range: [ 0.5, 100 ]              # 射线有效最小、最大距离（m）。

    p_min: 0.12                          # 概率对数几率更新的下限。
    p_miss: 0.49                         # 射线穿过未命中障碍时的概率更新值。
    p_free: 0.499                        # 判定地图格为空闲的概率阈值。
    p_occ: 0.85                          # 判定地图格被占据的概率阈值。
    p_hit: 0.9                           # 射线命中障碍时的概率更新值。
    p_max: 0.98                          # 概率对数几率更新的上限。
    unk_thresh: 1.0                      # 膨胀计数地图未知比例阈值，范围 [0, 1]；越大越保守。
