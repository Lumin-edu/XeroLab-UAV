fastlio_super_mavros_controller:
  ros__parameters:
    # FAST-LIO and SUPER use the same numeric ENU world coordinates.
    fastlio_odom_topic: /Odometry
    vision_pose_topic: /mavros/vision_pose/pose
    # SUPER's complete piecewise seventh-order polynomial (heartbeat shares this topic).
    planning_trajectory_topic: /planning_cmd/poly_traj
    # action republishes complete polynomial messages here for recording/inspection.
    trajectory_passthrough_topic: /action/super_polynomial_trajectory
    goal_topic: /action/goal
    planner_goal_topic: /goal_pose

    state_topic: /mavros/state
    local_odom_topic: /mavros/local_position/odom
    setpoint_topic: /mavros/setpoint_raw/local
    arming_service: /mavros/cmd/arming
    mode_service: /mavros/set_mode

    output_frame_id: odom
    control_frame_id: map
    publish_rate_hz: 100.0
    # Sends SUPER acceleration in PositionTarget.acceleration_or_force (m/s^2).
    acceleration_feedforward: true
    # Time-scales the full SUPER trajectory so the commanded velocity norm is at most 1 m/s.
    max_velocity_mps: 1.0
    prestream_sec: 2.0
    command_timeout_sec: 0.5
    local_odom_timeout_sec: 1.0

    # Arming is deliberately manual by default. After a goal and setpoint
    # pre-stream, the node requests OFFBOARD; only then is the goal sent to SUPER.
    auto_arm: false
    auto_offboard: true
    request_interval_sec: 1.0

    # 这是独立于 fastlio_up 的标定值；平移单位为米，旋转使用 xyzw 四元数。
    base_link_to_base_translation: [0.0, 0.0, 0.0]
    base_link_to_base_rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

    # 仅当 MAVROS 本地 ENU 原点相对 FAST-LIO/SUPER 启动原点有已测固定偏移时设置；
    # 已验证配置使用零偏移，单位为米。
    planner_to_mavros_offset_xyz: [0.0, 0.0, 0.0]
